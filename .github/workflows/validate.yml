name: Validate build tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Python build and preparation tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript GPU probe tests
        run: node --test tests/gpu_probe.test.mjs
      - name: Python syntax
        run: python -m py_compile tools/windows_build.py tools/prepare_windows_ci.py
      - name: JavaScript syntax
        run: node --check tools/gpu_probe.mjs
      - name: Whitespace
        run: git diff --check
